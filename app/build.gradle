plugins {
    id 'application'
}

repositories {
    mavenCentral()
    // Add local repository for JavaFX jars
    flatDir {
        dirs '../libs/javafx/lib'
    }
}

dependencies {
    implementation name: 'javafx.base'
    implementation name: 'javafx.controls'
    implementation name: 'javafx.fxml'
    implementation name: 'javafx.graphics'
    // add others if you use them:
    // implementation name: 'javafx-media'
    // implementation name: 'javafx-web'
}

application {
    mainClass = 'org.example.App'
}

tasks.withType(JavaExec) {
    // Detect OS and set JavaFX modules
    def javafxPath = "../libs/javafx/lib"
    def osName = org.gradle.internal.os.OperatingSystem.current()
    def platform = osName.isWindows() ? 'win' : osName.isMacOsX() ? 'mac' : 'linux'
    jvmArgs = [
        "--module-path", javafxPath,
        "--add-modules", "javafx.controls,javafx.fxml",
	"-Djava.library.path=" + javafxPath
    ]
}
